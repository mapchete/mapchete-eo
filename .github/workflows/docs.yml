name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write      # Required for deploying to GitHub Pages
  id-token: write   # Required for OIDC tokens

# Ensure only one concurrent deployment is running
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install System Dependencies (GDAL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev g++

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: |
          uv lock --upgrade
          uv sync --all-extras
        env:
          GDAL_CONFIG: /usr/bin/gdal-config

      - name: Build documentation
        run: |
          uv run sphinx-build -b html docs/source docs/build/html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs/build/html

    deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5