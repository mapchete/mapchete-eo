name: dependabot-uv-conda-sync

on:
  schedule:
    - cron: '0 0 * * *'       # Daily maintenance
  pull_request:               # Runs on Dependabot (and all) PRs
    paths:
      - "pyproject.toml"
  workflow_dispatch:          # Manual trigger

jobs:
  sync-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Use a PAT if you want this push to trigger other CI workflows
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync and Upgrade
        run: |
          # Ensure uv.lock is perfectly synced with pyproject.toml
          uv lock --upgrade

      - name: Sync Conda Recipe
        run: |
          # Use pyproject2conda to keep meta.yaml in sync
          # Note: Add -m for custom name mappings if needed
          uvx pyproject2conda yaml -f pyproject.toml --output conda/meta.yaml

      - name: Commit Changes
        # This step only runs if uv or conda files changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync uv.lock and conda recipe"
          file_pattern: "uv.lock conda/meta.yaml"