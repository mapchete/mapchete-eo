name: Python package test

on:
  push:
    branches: [main]
    paths-ignore:
      - "uv.lock"
      - "conda/meta.yaml"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "uv.lock"
      - "conda/meta.yaml"     
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_call:

jobs:
  setup:
      name: "🏗️ Build Py${{ matrix.python-version }}"
      runs-on: ubuntu-latest
      strategy:
        matrix:
          python-version: ["3.10", "3.11", "3.12", "3.13"]
      container: ghcr.io/osgeo/gdal:ubuntu-full-latest
      steps:
        - uses: actions/checkout@v4

        - name: ⚡ Install uv
          run: |
            apt-get update && apt-get install -y curl
            curl -LsSf https://astral.sh/uv/install.sh | BINDIR=/usr/local/bin sh

        - name: 🏗️ Create Environment
          run: |
            uv python install ${{ matrix.python-version }}
            uv sync --frozen --all-extras --python ${{ matrix.python-version }}
        - name: 📦 Archive Workspace
          run: tar -cf workspace.tar . 
        - name: 📤 Upload venv Workspace
          uses: actions/upload-artifact@v4
          with:
            name: workspace-${{ matrix.python-version }}
            path: workspace.tar
  test:
    needs: setup
    name: "🧪 py${{ matrix.python-version }} [${{ matrix.split }}/4]"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        split: [1, 2, 3, 4]
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    steps:
      - uses: actions/checkout@v4
      - name: 📥 Download Environment
        uses: actions/download-artifact@v4
        with:
          name: venv-${{ matrix.python-version }}
      
      - name: 🔓 Restore Env
        run: |
          tar -xf workspace.tar
          apt-get update && apt-get install -y curl
          curl -LsSf https://astral.sh/uv/install.sh | BINDIR=/usr/local/bin sh

      - name: 🧪 Run Split
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_PAYER: ${{ vars.AWS_REQUEST_PAYER }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_ACCESS_SECRET: ${{ secrets.CDSE_S3_ACCESS_SECRET }}
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
          UV_LINK_MODE: copy
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv run --no-sync python -m pytest -v \
            --splits 4 \
            --group ${{ matrix.split }} \
            --cov=mapchete_eo \
            --cov-report=xml:coverage.xml \
            --junitxml="pytest-${{ matrix.python-version }}-${{ matrix.split }}.xml"

      - name: 📊 Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: py${{ matrix.python-version }},split${{ matrix.split }}

      - name: 📤 Archive JUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.python-version }}-${{ matrix.split }}
          path: pytest-${{ matrix.python-version }}-${{ matrix.split }}.xml
          retention-days: 1

  summary:
    name: "📊 Final Summary"
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download All Results
        uses: actions/download-artifact@v4
        with:
          path: all-results
          pattern: results-*
          merge-multiple: true

      - name: 📝 Check Matrix Success
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Some test splits failed."
            exit 1
          fi
          echo "✅ All 16 splits passed across all Python versions!"          