name: Python package test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_call:

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    # 🏷️ This makes the UI subdivided and easy to read!
    name: 🐍 ${{ matrix.python-version }} • 🧩 Split ${{ matrix.split }}/${{ strategy.job-total / 4 }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
        split: [1, 2, 3, 4]

    # Move common env vars here to keep the "run" step clean
    env:
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Load Updated Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: updated-deps

      - name: 🏗️ Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🧹 Lint Check
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --all-files

      - name: 🌍 Install GIS System Deps
        run: |
          sudo apt-add-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get -y update
          sudo apt-get install -y gdal-bin libgdal-dev libproj-dev libgeos-dev g++

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 🛠️ Sync Environment
        env:
          GDAL_CONFIG: /usr/bin/gdal-config
        run: |
          uv sync --all-extras
          uv pip install pytest-split

      - name: 🧪 Run Partitioned Tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_PAYER: ${{ vars.AWS_REQUEST_PAYER }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_ACCESS_SECRET: ${{ secrets.CDSE_S3_ACCESS_SECRET }}
        run: |
          uv run pytest -v \
            --splits 4 \
            --group ${{ matrix.split }} \
            --cov mapchete_eo \
            --cov-report xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --junitxml=pytest-${{ matrix.python-version }}-${{ matrix.split }}.xml

      - name: 📊 Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mapchete/mapchete-eo
          # Adding flags makes the Codecov UI prettier too!
          flags: py${{ matrix.python-version }},split${{ matrix.split }}