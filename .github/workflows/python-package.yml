name: Python package test

on:
  push:
    branches: [main]
    paths-ignore:
      - "uv.lock"
      - "conda/meta.yaml"
      - "docs/**"    
  pull_request:
    branches: [main]
    paths-ignore:
      - "uv.lock"
      - "conda/meta.yaml"     
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_call:

jobs:
  test:
    name: "🐍 ${{ matrix.python-version }} • 🧩 Split ${{ matrix.split }} of 4"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: ["ubuntu-latest"]
        split: [1, 2, 3, 4]

    env:
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Load Updated Lockfile
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: updated-deps

      - name: 🏗️ Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🌍 GIS System Deps
        run: |
          sudo apt-add-repository -y ppa:ubuntugis/ubuntugis-unstable
          sudo apt-get -y update
          sudo apt-get install -y gdal-bin libgdal-dev libproj-dev libgeos-dev g++

      - name: ⚡ Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 🛠️ Install
        run: |
          uv sync --all-extras
          uv pip install pytest-split

      - name: 🧪 Run Tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REQUEST_PAYER: ${{ vars.AWS_REQUEST_PAYER }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_ACCESS_SECRET: ${{ secrets.CDSE_S3_ACCESS_SECRET }}
        run: |
          uv run pytest -v \
            --splits 4 \
            --group ${{ matrix.split }} \
            --cov mapchete_eo \
            --cov-report xml:coverage.xml \
            --junitxml=pytest-${{ matrix.python-version }}-${{ matrix.split }}.xml

      - name: 📊 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: mapchete/mapchete-eo
          flags: py${{ matrix.python-version }},split${{ matrix.split }}