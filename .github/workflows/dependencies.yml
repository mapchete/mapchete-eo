name: dependabot-uv-conda-sync

on:
  schedule:
    - cron: '0 0 * * *'       # Daily maintenance
  pull_request:               # Runs when pyproject.toml changes in a PR
    paths:
      - "pyproject.toml"
  workflow_dispatch:          # Manual trigger

jobs:
  sync-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync and Upgrade
        run: |
          # Ensure uv.lock is perfectly synced and sub-deps are updated
          uv lock --upgrade

      - name: Sync Conda Recipe
        run: |
          # Use uvx to run pyproject2conda without adding it to project deps.
          # We add '-m' for known name mismatches between PyPI and Conda.
          uvx pyproject2conda yaml \
            -f pyproject.toml \
            --output conda/meta.yaml \
            --python-include infer
            
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update uv.lock and conda recipe"
          title: "chore(deps): sync uv and conda dependencies"
          body: |
            ### Automated Dependency Sync
            This PR was triggered by the daily maintenance schedule or a change in `pyproject.toml`.
            
            - **uv.lock**: Upgraded to latest compatible versions.
            - **conda/meta.yaml**: Synchronized with `pyproject.toml` using `pyproject2conda`.
            
            Please verify that the Conda mappings and lockfile versions are correct.
          branch: "automated-dependency-sync"
          delete-branch: true
          labels: |
            dependencies
            automated-pr